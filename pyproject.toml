[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "footballstats"
version = "0.1.0"
description = "A small Python library for football (soccer) statistics and analytics"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Prince Lamptey Addo Antwi" }
]

[tool.setuptools.packages.find]
include = ["footballstats*"]
